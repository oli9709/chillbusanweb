<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chill Busan Tours</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 80px 20px 40px;
        }
        .dashboard-header {
            max-width: 1200px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .dashboard-header h1 {
            font-family: 'Lora', serif;
            font-size: 2.5rem;
            color: #2c3e50;
            margin: 0;
        }
        .dashboard-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #65C7D0);
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .dashboard-card[style*="grid-column"] {
            grid-column: 1 / -1;
        }
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .dashboard-card h2 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .welcome-bonus-card {
            background: linear-gradient(135deg, #D4AF37, #FFD700);
            color: white;
        }
        .welcome-bonus-card h2 {
            color: white;
        }
        .bonus-status {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 15px;
        }
        .bonus-status.active {
            background: rgba(255, 255, 255, 0.3);
        }
        .bonus-status i {
            font-size: 2rem;
        }
        .bookings-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .booking-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .booking-item:last-child {
            border-bottom: none;
        }
        .booking-item h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }
        .booking-item p {
            margin: 4px 0;
            color: #666;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .booking-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .booking-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .booking-card-header h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.2rem;
            font-family: 'Lora', serif;
        }
        .booking-date {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-paid {
            background: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .status-refunded {
            background: #d1ecf1;
            color: #0c5460;
        }
        .booking-card-body {
            margin-bottom: 20px;
        }
        .booking-price {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .price-main {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
        }
        .price-krw {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .price-usd {
            font-size: 1rem;
            color: #666;
        }
        .discount-info {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #4a90e2;
            font-weight: 500;
        }
        .booking-items {
            margin-top: 15px;
        }
        .booking-items h4 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
        }
        .booking-item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }
        .booking-item-row:last-child {
            border-bottom: none;
        }
        .booking-card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        .btn-action {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-pay-now {
            background: linear-gradient(135deg, #4A90E2, #65C7D0);
            color: white;
        }
        .btn-pay-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
        }
        .btn-download {
            background: #6c757d;
            color: white;
        }
        .btn-download:hover {
            background: #5a6268;
        }
        .btn-refund {
            background: #dc3545;
            color: white;
        }
        .btn-refund:hover {
            background: #c82333;
        }
        .btn-link {
            color: #4a90e2;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px 0;
            align-self: center;
        }
        .btn-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>My Dashboard</h1>
            <div class="dashboard-actions">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Home
                </a>
                <button class="btn btn-secondary" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>

        <div class="dashboard-content">
            <!-- Welcome Bonus Card -->
            <div class="dashboard-card welcome-bonus-card">
                <h2><i class="fas fa-gift"></i> Welcome Bonus</h2>
                <div id="bonus-status" class="bonus-status">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>
                        <p style="margin: 0; font-weight: 600;">Loading...</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Checking your discount status</p>
                    </div>
                </div>
            </div>

            <!-- My Bookings Card -->
            <div class="dashboard-card" style="grid-column: 1 / -1;">
                <h2><i class="fas fa-calendar-check"></i> My Bookings</h2>
                <div id="bookings-container">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading bookings...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="src/utils/supabase.js"></script>
    <script>

        const logoutBtn = document.getElementById('logout-btn');
        
        // Listen for auth state changes and handle session expiration
        if (window.supabaseAuth && window.supabaseAuth.getSupabase) {
            const supabase = window.supabaseAuth.getSupabase();
            if (supabase && supabase.auth) {
                supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED') {
                        if (!session || !session.user) {
                            window.location.href = 'login.html?expired=true';
                        }
                    }
                });
            }
        }
        const bonusStatusDiv = document.getElementById('bonus-status');
        const bookingsContainer = document.getElementById('bookings-container');

        // Check authentication with session expiration handling
        async function checkAuth() {
            try {
                const { user, error } = await window.supabaseAuth.getCurrentUser();
                
                if (error) {
                    // Check if it's a session expiration error
                    if (error.message && (error.message.includes('JWT') || error.message.includes('expired') || error.message.includes('invalid'))) {
                        window.location.href = 'login.html?expired=true';
                        return null;
                    }
                }
                
                if (!user) {
                    window.location.href = 'login.html';
                    return null;
                }
                
                // Verify session is still valid
                const supabase = window.supabaseAuth.getSupabase();
                if (supabase) {
                    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                    if (sessionError || !session || !session.user) {
                        window.location.href = 'login.html?expired=true';
                        return null;
                    }
                }
                
                return user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html?expired=true';
                return null;
            }
        }

        // Load welcome bonus status with timeout protection
        async function loadBonusStatus(userId) {
            // Set timeout to prevent infinite loading
            const timeout = setTimeout(() => {
                if (bonusStatusDiv.querySelector('.fa-spinner')) {
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Unable to load status</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Please refresh the page</p>
                        </div>
                    `;
                }
            }, 10000);
            
            try {
                const status = await window.supabaseAuth.getUserDiscountStatus(userId);
                clearTimeout(timeout);
                
                const { hasDiscount, discountExpiry, error } = status;
                
                if (error) {
                    let errorMsg = 'Please try refreshing';
                    if (error.message && !error.message.includes('undefined')) {
                        // Escape error message to prevent XSS
                        const div = document.createElement('div');
                        div.textContent = error.message;
                        errorMsg = div.innerHTML;
                    } else if (error.code === 'PGRST116') {
                        errorMsg = 'Your account is being set up. Please refresh in a moment.';
                    }
                    
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Unable to load discount status</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">${errorMsg}</p>
                        </div>
                    `;
                    return;
                }

                // Handle case where user doesn't exist (status returns hasDiscount: false, discountExpiry: null)
                if (hasDiscount === false && discountExpiry === null && !error) {
                    // User might not have discount record yet - show as available
                    bonusStatusDiv.className = 'bonus-status active';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-gift"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">10% Welcome Discount Available!</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Use it on your first booking</p>
                        </div>
                    `;
                } else if (hasDiscount && discountExpiry) {
                    const expiryDate = new Date(discountExpiry);
                    const now = new Date();
                    const daysLeft = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));
                    
                    bonusStatusDiv.className = 'bonus-status active';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-check-circle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">10% Discount Available!</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">
                                Expires: ${expiryDate.toLocaleDateString()} (${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left)
                            </p>
                        </div>
                    `;
                } else {
                    bonusStatusDiv.className = 'bonus-status';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-times-circle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Discount Used or Expired</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">You've already used your welcome bonus</p>
                        </div>
                    `;
                }
            } catch (error) {
                clearTimeout(timeout);
                console.error('Error loading bonus status:', error);
                
                let errorMsg = 'Please try refreshing';
                if (error.message && error.message.includes('network')) {
                    errorMsg = 'Network issue. Check your connection and try again.';
                } else if (error.message) {
                    // Escape error message
                    const div = document.createElement('div');
                    div.textContent = error.message;
                    errorMsg = div.innerHTML;
                }
                
                bonusStatusDiv.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>
                        <p style="margin: 0; font-weight: 600;">Unable to load discount status</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">${errorMsg}</p>
                    </div>
                `;
            }
        }

        // Load user bookings with improved error handling
        async function loadBookings(userId) {
            try {
                // Use new API endpoint
                const response = await fetch(`/api/users/${userId}/bookings`);
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const bookings = await response.json();

                // Handle empty array
                if (!bookings || bookings.length === 0) {
                    bookingsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <p>You haven't booked any tours yet</p>
                            <a href="index.html" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                                Book Your First Tour
                            </a>
                        </div>
                    `;
                    return;
                }

                // Render booking cards
                renderBookingCards(bookings);
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                
                let errorMessage = 'We couldn\'t load your bookings right now.';
                let showRetry = true;
                
                if (error.message && (error.message.includes('Failed to fetch') || error.message.includes('NetworkError'))) {
                    errorMessage = 'Looks like you\'re offline. Please check your internet connection and try again.';
                } else if (error.message && (error.message.includes('401') || error.message.includes('403'))) {
                    errorMessage = 'Your session has expired. We\'ll redirect you to sign in...';
                    showRetry = false;
                    setTimeout(() => window.location.href = 'login.html?expired=true', 2000);
                } else if (error.message && error.message.includes('500')) {
                    errorMessage = 'Our servers are having a moment. Please try again in a few seconds.';
                }
                
                const retryButton = showRetry ? 
                    `<button onclick="loadBookings('${userId}')" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                        <i class="fas fa-redo"></i> Try Again
                    </button>` : '';
                
                bookingsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i>
                        <p style="margin: 15px 0;">${errorMessage}</p>
                        ${retryButton}
                    </div>
                `;
            }
        }

        // Render booking cards
        function renderBookingCards(bookings) {
            bookingsContainer.innerHTML = '';
            
            bookings.forEach(booking => {
                const card = createBookingCard(booking);
                bookingsContainer.appendChild(card);
            });
        }

        // Create booking card element
        function createBookingCard(booking) {
            const card = document.createElement('div');
            card.className = 'booking-card';
            
            // Helper to escape HTML
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // Format date
            const bookingDate = booking.created_at ? new Date(booking.created_at).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) : 'N/A';
            
            // Calculate USD (approximate: 1 USD = 1300 KRW)
            const usdAmount = Math.round((booking.final_amount_krw || 0) / 1300);
            
            // Status badge
            const statusBadge = getStatusBadge(booking.status);
            
            // Items list
            const itemsHtml = booking.items && booking.items.length > 0
                ? booking.items.map(item => `
                    <div class="booking-item-row">
                        <span>${escapeHtml(item.name)}</span>
                        <span>₩${(item.unit_price_krw || 0).toLocaleString()} × ${item.quantity || 1}</span>
                    </div>
                `).join('')
                : '<p style="color: #999; font-size: 0.9rem;">No items</p>';
            
            // Action buttons
            const actionsHtml = getBookingActions(booking);
            
            card.innerHTML = `
                <div class="booking-card-header">
                    <div>
                        <h3>Booking ${escapeHtml(booking.id.substring(0, 8))}...</h3>
                        <p class="booking-date"><i class="fas fa-calendar"></i> ${bookingDate}</p>
                    </div>
                    ${statusBadge}
                </div>
                <div class="booking-card-body">
                    <div class="booking-price">
                        <div class="price-main">
                            <span class="price-krw">₩${(booking.final_amount_krw || 0).toLocaleString()}</span>
                            <span class="price-usd">≈ $${usdAmount} USD</span>
                        </div>
                        ${booking.discount_percent > 0 ? `
                            <p class="discount-info">${booking.discount_percent}% discount applied</p>
                        ` : ''}
                    </div>
                    <div class="booking-items">
                        <h4>Items:</h4>
                        ${itemsHtml}
                    </div>
                </div>
                <div class="booking-card-actions">
                    ${actionsHtml}
                </div>
            `;
            
            return card;
        }

        // Get status badge HTML
        function getStatusBadge(status) {
            const badges = {
                'pending': '<span class="status-badge status-pending">Pending</span>',
                'paid': '<span class="status-badge status-paid">Paid</span>',
                'cancelled': '<span class="status-badge status-cancelled">Cancelled</span>',
                'refunded': '<span class="status-badge status-refunded">Refunded</span>'
            };
            return badges[status] || '<span class="status-badge">Unknown</span>';
        }

        // Get booking actions HTML
        function getBookingActions(booking) {
            let actions = [];
            
            // Download PDF (always available)
            actions.push(`
                <button onclick="downloadBookingPDF('${booking.id}')" class="btn-action btn-download">
                    <i class="fas fa-download"></i> Download PDF
                </button>
            `);
            
            // Conditional actions based on status and payment_option
            if (booking.status === 'pending' && booking.payment_option === 'pay_now') {
                // Pay Now button
                actions.push(`
                    <button onclick="payNowBooking('${booking.id}')" class="btn-action btn-pay-now">
                        <i class="fas fa-credit-card"></i> Pay Now
                    </button>
                `);
                // Pay After link
                actions.push(`
                    <a href="#" onclick="event.preventDefault(); changeToPayAfter('${booking.id}');" class="btn-link">
                        Pay After
                    </a>
                `);
            } else if (booking.status === 'paid') {
                // Request Refund button
                actions.push(`
                    <button onclick="requestRefund('${booking.id}')" class="btn-action btn-refund">
                        <i class="fas fa-undo"></i> Request Refund
                    </button>
                `);
            }
            
            return actions.join('');
        }

        // Pay Now - Create Stripe session
        async function payNowBooking(bookingId) {
            try {
                const response = await fetch(`/api/bookings/${bookingId}/create-session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success && result.checkoutUrl) {
                    // Redirect to Stripe Checkout
                    window.location.href = result.checkoutUrl;
                } else {
                    throw new Error(result.message || 'Failed to create payment session');
                }
            } catch (error) {
                console.error('Error creating payment session:', error);
                alert('Failed to create payment session: ' + error.message);
            }
        }

        // Change to Pay After
        async function changeToPayAfter(bookingId) {
            if (!confirm('Change payment option to "Pay After"? You will pay on the day of the tour.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/bookings/${bookingId}/update-payment-option`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Reload bookings to show updated status
                    const user = await checkAuth();
                    if (user) {
                        await loadBookings(user.id);
                    }
                } else {
                    throw new Error(result.message || 'Failed to update payment option');
                }
            } catch (error) {
                console.error('Error updating payment option:', error);
                alert('Failed to update payment option: ' + error.message);
            }
        }

        // Request Refund
        async function requestRefund(bookingId) {
            if (!confirm('Request a refund for this booking? We will process your request within 24-48 hours.')) {
                return;
            }
            
            const reason = prompt('Please provide a reason for the refund (optional):') || '';
            
            try {
                const { user } = await window.supabaseAuth.getCurrentUser();
                if (!user) {
                    throw new Error('Please log in to request a refund');
                }
                
                const response = await fetch('/api/refunds/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        bookingId: bookingId,
                        reason: reason,
                        userId: user.id
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Refund request submitted successfully! We will process it within 24-48 hours.');
                    // Reload bookings to show updated status
                    await loadBookings(user.id);
                } else {
                    throw new Error(result.message || 'Failed to create refund request');
                }
            } catch (error) {
                console.error('Error requesting refund:', error);
                alert('Failed to request refund: ' + error.message);
            }
        }

        // Download PDF
        function downloadBookingPDF(bookingId) {
            window.open(`/api/bookings/${bookingId}/download-pdf`, '_blank');
        }

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await window.supabaseAuth.signOut();
            window.location.href = 'login.html';
        });

        // Initialize dashboard
        (async () => {
            const user = await checkAuth();
            if (user) {
                await loadBonusStatus(user.id);
                await loadBookings(user.id);
            }
        })();
    </script>
</body>
</html>
