<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chill Busan Tours</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 80px 20px 40px;
        }
        .dashboard-header {
            max-width: 1200px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .dashboard-header h1 {
            font-family: 'Lora', serif;
            font-size: 2.5rem;
            color: #2c3e50;
            margin: 0;
        }
        .dashboard-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #65C7D0);
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .dashboard-card[style*="grid-column"] {
            grid-column: 1 / -1;
        }
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .dashboard-card h2 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .welcome-bonus-card {
            background: linear-gradient(135deg, #D4AF37, #FFD700);
            color: white;
        }
        .welcome-bonus-card h2 {
            color: white;
        }
        .bonus-status {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 15px;
        }
        .bonus-status.active {
            background: rgba(255, 255, 255, 0.3);
        }
        .bonus-status i {
            font-size: 2rem;
        }
        .bookings-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .booking-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .booking-item:last-child {
            border-bottom: none;
        }
        .booking-item h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }
        .booking-item p {
            margin: 4px 0;
            color: #666;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .booking-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .booking-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .booking-card-header h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.2rem;
            font-family: 'Lora', serif;
        }
        .booking-date {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-paid {
            background: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .status-refunded {
            background: #d1ecf1;
            color: #0c5460;
        }
        .booking-card-body {
            margin-bottom: 20px;
        }
        .booking-price {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .price-main {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
        }
        .price-krw {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .price-usd {
            font-size: 1rem;
            color: #666;
        }
        .discount-info {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #4a90e2;
            font-weight: 500;
        }
        .booking-items {
            margin-top: 15px;
        }
        .booking-items h4 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
        }
        .booking-item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }
        .booking-item-row:last-child {
            border-bottom: none;
        }
        .booking-card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        .btn-action {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-pay-now {
            background: linear-gradient(135deg, #4A90E2, #65C7D0);
            color: white;
        }
        .btn-pay-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
        }
        .btn-download {
            background: #6c757d;
            color: white;
        }
        .btn-download:hover {
            background: #5a6268;
        }
        .btn-refund {
            background: #dc3545;
            color: white;
        }
        .btn-refund:hover {
            background: #c82333;
        }
        .btn-link {
            color: #4a90e2;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px 0;
            align-self: center;
        }
        .btn-link:hover {
            text-decoration: underline;
        }
        /* Tab Navigation */
        .dashboard-tabs {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            padding: 0 20px;
        }
        .tab-button {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        .tab-button:hover {
            color: var(--primary-color);
        }
        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Custom Tour Cards */
        .custom-tour-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .custom-tour-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .custom-tour-card.cancelled {
            opacity: 0.6;
            background: #f8f9fa;
        }
        .custom-tour-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .custom-tour-card-header h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.2rem;
            font-family: 'Lora', serif;
        }
        .itinerary-preview {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .itinerary-preview h4 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
        }
        .location-tag {
            display: inline-block;
            padding: 6px 12px;
            background: white;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px 4px 4px 0;
            color: #2c3e50;
        }
        .status-approved {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .btn-cancel {
            background: #dc3545;
            color: white;
        }
        .btn-cancel:hover {
            background: #c82333;
        }
        .btn-message {
            background: #17a2b8;
            color: white;
        }
        .btn-message:hover {
            background: #138496;
        }
        .btn-view {
            background: #28a745;
            color: white;
        }
        .btn-view:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>My Dashboard</h1>
            <div class="dashboard-actions">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Home
                </a>
                <button class="btn btn-secondary" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="dashboard-tabs">
            <button class="tab-button active" data-tab="bookings" onclick="switchTab('bookings')">
                <i class="fas fa-calendar-check"></i> My Bookings
            </button>
            <button class="tab-button" data-tab="custom" onclick="switchTab('custom')">
                <i class="fas fa-route"></i> Custom Tours
            </button>
        </div>

        <div class="dashboard-content">
            <!-- Welcome Bonus Card -->
            <div class="dashboard-card welcome-bonus-card">
                <h2><i class="fas fa-gift"></i> Welcome Bonus</h2>
                <div id="bonus-status" class="bonus-status">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>
                        <p style="margin: 0; font-weight: 600;">Loading...</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Checking your discount status</p>
                    </div>
                </div>
            </div>

            <!-- My Bookings Tab -->
            <div class="tab-content active" id="bookings-tab">
                <div class="dashboard-card" style="grid-column: 1 / -1;">
                    <h2><i class="fas fa-calendar-check"></i> My Bookings</h2>
                    <div id="bookings-container">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading bookings...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Custom Tours Tab -->
            <div class="tab-content" id="custom-tab">
                <div class="dashboard-card" style="grid-column: 1 / -1;">
                    <h2><i class="fas fa-route"></i> My Custom Tours</h2>
                    <div id="custom-tours-container">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading custom tours...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="src/utils/supabase.js"></script>
    <script src="utils/authGuard.js"></script>
    <script src="utils/toast.js"></script>
    <script>
        // Initialize toast
        initToast();

        const logoutBtn = document.getElementById('logout-btn');
        const bonusStatusDiv = document.getElementById('bonus-status');
        const bookingsContainer = document.getElementById('bookings-container');

        // AUTH GUARD: Check session before any API calls
        let currentSession = null;
        let currentUser = null;

        // AUTH GUARD: Check session before any API calls
        async function checkAuth() {
            try {
                const supabase = window.supabaseAuth?.getSupabase();
                if (!supabase) {
                    console.error('Supabase client not initialized');
                    window.location.replace('/login.html');
                    return null;
                }

                // Get session first (most reliable)
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError) {
                    console.error('Session error:', sessionError);
                    window.location.replace('/login.html?expired=true');
                    return null;
                }
                
                if (!session || !session.user) {
                    console.log('No active session');
                    window.location.replace('/login.html');
                    return null;
                }

                // Store session and user for later use
                currentSession = session;
                currentUser = session.user;
                
                // Listen for auth state changes
                // CRITICAL: Only set up listener once, prevent rehydration after logout
                if (!window._authListenerSet) {
                    window._authListenerSet = true;
                    supabase.auth.onAuthStateChange((event, newSession) => {
                        // CRITICAL: If logout flag is set, ignore all events
                        if (window._isLoggingOut) {
                            return;
                        }
                        
                        // If SIGNED_OUT, immediately redirect and don't process any other events
                        if (event === 'SIGNED_OUT') {
                            window._isLoggingOut = true; // Set flag to prevent rehydration
                            currentSession = null;
                            currentUser = null;
                            // Use replace to prevent back button
                            window.location.replace('/login.html?expired=true');
                            return;
                        }
                        
                        // Only update if we have a valid session and not logging out
                        if (event === 'TOKEN_REFRESHED' && newSession && newSession.user && !window._isLoggingOut) {
                            currentSession = newSession;
                            currentUser = newSession.user;
                        } else if (!newSession || !newSession.user) {
                            // Session expired or invalid
                            if (!window._isLoggingOut) {
                                currentSession = null;
                                currentUser = null;
                                window.location.replace('/login.html?expired=true');
                            }
                        }
                    });
                }
                
                return session.user;
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.replace('/login.html?expired=true');
                return null;
            }
        }

        // Load welcome bonus status with timeout protection
        async function loadBonusStatus(userId) {
            // Verify user is still authenticated
            if (!currentUser || currentUser.id !== userId) {
                const user = await checkAuth();
                if (!user) return; // Already redirected
                userId = user.id;
            }
            
            // Set timeout to prevent infinite loading
            const timeout = setTimeout(() => {
                if (bonusStatusDiv && bonusStatusDiv.querySelector('.fa-spinner')) {
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Unable to load status</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Please refresh the page</p>
                        </div>
                    `;
                }
            }, 10000);
            
            try {
                const status = await window.supabaseAuth.getUserDiscountStatus(userId);
                clearTimeout(timeout);
                
                if (!status) {
                    throw new Error('No status returned');
                }
                
                const { hasDiscount, discountExpiry, error } = status;
                
                if (error) {
                    let errorMsg = 'Please try refreshing';
                    if (error.message && !error.message.includes('undefined')) {
                        // Escape error message to prevent XSS
                        const div = document.createElement('div');
                        div.textContent = error.message;
                        errorMsg = div.innerHTML;
                    } else if (error.code === 'PGRST116') {
                        errorMsg = 'Your account is being set up. Please refresh in a moment.';
                    }
                    
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Unable to load discount status</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">${errorMsg}</p>
                        </div>
                    `;
                    return;
                }

                // Handle case where user doesn't exist (status returns hasDiscount: false, discountExpiry: null)
                if (hasDiscount === false && discountExpiry === null && !error) {
                    // User might not have discount record yet - show as available
                    bonusStatusDiv.className = 'bonus-status active';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-gift"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">10% Welcome Discount Available!</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">Use it on your first booking</p>
                        </div>
                    `;
                } else if (hasDiscount && discountExpiry) {
                    const expiryDate = new Date(discountExpiry);
                    const now = new Date();
                    const daysLeft = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));
                    
                    bonusStatusDiv.className = 'bonus-status active';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-check-circle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">10% Discount Available!</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">
                                Expires: ${expiryDate.toLocaleDateString()} (${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left)
                            </p>
                        </div>
                    `;
                } else {
                    bonusStatusDiv.className = 'bonus-status';
                    bonusStatusDiv.innerHTML = `
                        <i class="fas fa-times-circle"></i>
                        <div>
                            <p style="margin: 0; font-weight: 600;">Discount Used or Expired</p>
                            <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">You've already used your welcome bonus</p>
                        </div>
                    `;
                }
            } catch (error) {
                clearTimeout(timeout);
                console.error('Error loading bonus status:', error);
                
                let errorMsg = 'Please try refreshing';
                if (error.message && error.message.includes('network')) {
                    errorMsg = 'Network issue. Check your connection and try again.';
                } else if (error.message) {
                    // Escape error message
                    const div = document.createElement('div');
                    div.textContent = error.message;
                    errorMsg = div.innerHTML;
                }
                
                bonusStatusDiv.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>
                        <p style="margin: 0; font-weight: 600;">Unable to load discount status</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.85rem; opacity: 0.9;">${errorMsg}</p>
                    </div>
                `;
            }
        }

        // Load user bookings with improved error handling
        async function loadBookings(userId) {
            // Verify user is still authenticated
            if (!currentUser || currentUser.id !== userId) {
                const user = await checkAuth();
                if (!user) return; // Already redirected
                userId = user.id;
            }
            
            try {
                // Use new API endpoint
                const response = await fetch(`/api/users/${userId}/bookings`);
                
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        window.location.replace('/login.html?expired=true');
                        return;
                    }
                    throw new Error(`Server error: ${response.status}`);
                }
                
                // Ensure response is valid JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Invalid response format from server');
                }
                
                const result = await response.json();
                
                // Handle both old format (array) and new format (object with bookings array)
                let bookings = [];
                if (Array.isArray(result)) {
                    bookings = result;
                } else if (result && result.bookings && Array.isArray(result.bookings)) {
                    bookings = result.bookings;
                } else if (result && result.success && Array.isArray(result.data)) {
                    bookings = result.data;
                } else {
                    console.error('Invalid bookings format:', result);
                    throw new Error('Invalid bookings data format');
                }

                // Handle empty array
                if (!bookings || bookings.length === 0) {
                    bookingsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <p>You haven't booked any tours yet</p>
                            <a href="index.html" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                                Book Your First Tour
                            </a>
                        </div>
                    `;
                    return;
                }

                // Render booking cards
                renderBookingCards(bookings);
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                
                let errorMessage = 'We couldn\'t load your bookings right now.';
                let showRetry = true;
                
                if (error.message && (error.message.includes('Failed to fetch') || error.message.includes('NetworkError'))) {
                    errorMessage = 'Looks like you\'re offline. Please check your internet connection and try again.';
                } else if (error.message && (error.message.includes('401') || error.message.includes('403'))) {
                    errorMessage = 'Your session has expired. We\'ll redirect you to sign in...';
                    showRetry = false;
                    setTimeout(() => window.location.replace('/login.html?expired=true'), 2000);
                } else if (error.message && error.message.includes('500')) {
                    errorMessage = 'Our servers are having a moment. Please try again in a few seconds.';
                }
                
                const retryButton = showRetry ? 
                    `<button onclick="loadBookings('${userId}')" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                        <i class="fas fa-redo"></i> Try Again
                    </button>` : '';
                
                bookingsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i>
                        <p style="margin: 15px 0;">${errorMessage}</p>
                        ${retryButton}
                    </div>
                `;
            }
        }

        // Render booking cards
        function renderBookingCards(bookings) {
            bookingsContainer.innerHTML = '';
            
            bookings.forEach(booking => {
                const card = createBookingCard(booking);
                bookingsContainer.appendChild(card);
            });
        }

        // Create booking card element
        function createBookingCard(booking) {
            const card = document.createElement('div');
            card.className = 'booking-card';
            
            // Helper to escape HTML
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // Format date
            const bookingDate = booking.created_at ? new Date(booking.created_at).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) : 'N/A';
            
            // Calculate USD (approximate: 1 USD = 1300 KRW)
            const usdAmount = Math.round((booking.final_amount_krw || 0) / 1300);
            
            // Status badge
            const statusBadge = getStatusBadge(booking.status);
            
            // Items list
            const itemsHtml = booking.items && booking.items.length > 0
                ? booking.items.map(item => `
                    <div class="booking-item-row">
                        <span>${escapeHtml(item.name)}</span>
                        <span>₩${(item.unit_price_krw || 0).toLocaleString()} × ${item.quantity || 1}</span>
                    </div>
                `).join('')
                : '<p style="color: #999; font-size: 0.9rem;">No items</p>';
            
            // Action buttons
            const actionsHtml = getBookingActions(booking);
            
            card.innerHTML = `
                <div class="booking-card-header">
                    <div>
                        <h3>Booking ${escapeHtml(booking.id.substring(0, 8))}...</h3>
                        <p class="booking-date"><i class="fas fa-calendar"></i> ${bookingDate}</p>
                    </div>
                    ${statusBadge}
                </div>
                <div class="booking-card-body">
                    <div class="booking-price">
                        <div class="price-main">
                            <span class="price-krw">₩${(booking.final_amount_krw || 0).toLocaleString()}</span>
                            <span class="price-usd">≈ $${usdAmount} USD</span>
                        </div>
                        ${booking.discount_percent > 0 ? `
                            <p class="discount-info">${booking.discount_percent}% discount applied</p>
                        ` : ''}
                    </div>
                    <div class="booking-items">
                        <h4>Items:</h4>
                        ${itemsHtml}
                    </div>
                </div>
                <div class="booking-card-actions">
                    ${actionsHtml}
                </div>
            `;
            
            return card;
        }

        // Get status badge HTML
        function getStatusBadge(status) {
            const badges = {
                'pending': '<span class="status-badge status-pending">Pending</span>',
                'paid': '<span class="status-badge status-paid">Paid</span>',
                'cancelled': '<span class="status-badge status-cancelled">Cancelled</span>',
                'refunded': '<span class="status-badge status-refunded">Refunded</span>'
            };
            return badges[status] || '<span class="status-badge">Unknown</span>';
        }

        // Get booking actions HTML
        function getBookingActions(booking) {
            let actions = [];
            
            // Download PDF (always available)
            actions.push(`
                <button onclick="downloadBookingPDF('${booking.id}')" class="btn-action btn-download">
                    <i class="fas fa-download"></i> Download PDF
                </button>
            `);
            
            // Conditional actions based on status and payment_option
            if (booking.status === 'pending' && booking.payment_option === 'pay_now') {
                // Pay Now button
                actions.push(`
                    <button onclick="payNowBooking('${booking.id}')" class="btn-action btn-pay-now">
                        <i class="fas fa-credit-card"></i> Pay Now
                    </button>
                `);
                // Pay After link
                actions.push(`
                    <a href="#" onclick="event.preventDefault(); changeToPayAfter('${booking.id}');" class="btn-link">
                        Pay After
                    </a>
                `);
            } else if (booking.status === 'paid') {
                // Request Refund button
                actions.push(`
                    <button onclick="requestRefund('${booking.id}')" class="btn-action btn-refund">
                        <i class="fas fa-undo"></i> Request Refund
                    </button>
                `);
            }
            
            return actions.join('');
        }

        // Pay Now - Create Stripe session
        async function payNowBooking(bookingId) {
            try {
                const response = await fetch(`/api/bookings/${bookingId}/create-session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success && result.checkoutUrl) {
                    // Redirect to Stripe Checkout
                    window.location.href = result.checkoutUrl;
                } else {
                    throw new Error(result.message || 'Failed to create payment session');
                }
            } catch (error) {
                console.error('Error creating payment session:', error);
                alert('Failed to create payment session: ' + error.message);
            }
        }

        // Change to Pay After
        async function changeToPayAfter(bookingId) {
            if (!confirm('Change payment option to "Pay After"? You will pay on the day of the tour.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/bookings/${bookingId}/update-payment-option`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Reload bookings to show updated status
                    const user = await checkAuth();
                    if (user) {
                        await loadBookings(user.id);
                    }
                } else {
                    throw new Error(result.message || 'Failed to update payment option');
                }
            } catch (error) {
                console.error('Error updating payment option:', error);
                alert('Failed to update payment option: ' + error.message);
            }
        }

        // Request Refund
        async function requestRefund(bookingId) {
            if (!confirm('Request a refund for this booking? We will process your request within 24-48 hours.')) {
                return;
            }
            
            const reason = prompt('Please provide a reason for the refund (optional):') || '';
            
            try {
                const { user } = await window.supabaseAuth.getCurrentUser();
                if (!user) {
                    throw new Error('Please log in to request a refund');
                }
                
                const response = await fetch('/api/refunds/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        bookingId: bookingId,
                        reason: reason,
                        userId: user.id
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Refund request submitted successfully! We will process it within 24-48 hours.');
                    // Reload bookings to show updated status
                    await loadBookings(user.id);
                } else {
                    throw new Error(result.message || 'Failed to create refund request');
                }
            } catch (error) {
                console.error('Error requesting refund:', error);
                alert('Failed to request refund: ' + error.message);
            }
        }

        // Download PDF
        function downloadBookingPDF(bookingId) {
            window.open(`/api/bookings/${bookingId}/download-pdf`, '_blank');
        }

        // Logout - Fixed implementation with toast
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // Prevent double clicks
            if (logoutBtn.dataset.processing === 'true') return;
            logoutBtn.dataset.processing = 'true';
            
            // Set logout flag immediately to prevent any race conditions
            window._isLoggingOut = true;
            
            try {
                // Disable button to prevent double-clicks
                logoutBtn.disabled = true;
                logoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing out...';
                
                // Call signOut which handles everything (clears storage, shows toast, redirects)
                await window.supabaseAuth.signOut();
                
                // signOut() already redirects via window.location.replace() after showing toast
            } catch (error) {
                console.error('Logout error:', error);
                // Clear storage and redirect anyway
                if (window.supabaseAuth && window.supabaseAuth.clearAuthStorage) {
                    window.supabaseAuth.clearAuthStorage();
                }
                window.location.replace('/login.html');
            }
        });

        // Tab switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Load data if needed
            if (tabName === 'custom') {
                const user = window.currentUser;
                if (user) {
                    loadCustomTours(user.id);
                }
            }
        }

        // Load custom tours
        async function loadCustomTours(userId) {
            const container = document.getElementById('custom-tours-container');
            
            try {
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading custom tours...</p>
                    </div>
                `;

                const response = await fetch(`/api/user/custom-tours?userId=${userId}`);
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const result = await response.json();
                
                // Handle both old format (array) and new format (object with customTours array)
                let customTours = [];
                if (Array.isArray(result)) {
                    customTours = result;
                } else if (result && result.customTours && Array.isArray(result.customTours)) {
                    customTours = result.customTours;
                } else if (result && result.success && Array.isArray(result.data)) {
                    customTours = result.data;
                } else {
                    console.error('Invalid custom tours format:', result);
                    throw new Error('Invalid custom tours data format');
                }

                if (!customTours || customTours.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-route"></i>
                            <p>You haven't created any custom tours yet</p>
                            <a href="/custom-builder" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                                Create Custom Tour
                            </a>
                        </div>
                    `;
                    return;
                }

                renderCustomTourCards(customTours);

            } catch (error) {
                console.error('Error loading custom tours:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load custom tours</p>
                        <button onclick="loadCustomTours('${userId}')" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                            Try Again
                        </button>
                    </div>
                `;
            }
        }

        // Render custom tour cards
        function renderCustomTourCards(tours) {
            const container = document.getElementById('custom-tours-container');
            container.innerHTML = '';

            tours.forEach(tour => {
                const card = createCustomTourCard(tour);
                container.appendChild(card);
            });
        }

        // Create custom tour card
        function createCustomTourCard(tour) {
            const card = document.createElement('div');
            card.className = `custom-tour-card ${tour.status === 'cancelled' ? 'cancelled' : ''}`;

            // Format date
            const tourDate = tour.startTime ? new Date(tour.startTime).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }) : 'N/A';

            // Format price
            const priceUSD = (tour.totalPrice / 100).toFixed(2);

            // Status badge
            const statusBadge = getCustomTourStatusBadge(tour.status);

            // Itinerary preview
            const locations = tour.itinerary?.locations || [];
            const locationNames = {
                gamcheon: 'Gamcheon Culture Village',
                gwangalli: 'Gwangalli Beach & Bridge',
                haeundae: 'Haeundae Beach',
                oryukdo: 'Oryukdo Island and Skywalk',
                haedong: 'Haedong Yonggungsa Temple',
                hwamyeong: 'Hwamyeong Eco Park',
                songdo: 'Songdo Beach + Cable Car',
                blueline: 'Blue Line Park (Capsule train)',
                jagalchi: 'Jagalchi Fish Market',
                dadaepo: 'Dadaepo Beach + Sunset'
            };

            const locationTags = locations.map(loc => 
                `<span class="location-tag">${locationNames[loc] || loc}</span>`
            ).join('');

            // Addons preview
            const addonNames = {
                drone: 'Drone Package',
                photographer: 'Professional Photographer',
                pickup: 'Hotel Pickup & Drop-off'
            };
            const addonsList = (tour.addons || []).map(addon => addonNames[addon] || addon).join(', ');

            // Action buttons
            const actionsHtml = getCustomTourActions(tour);

            card.innerHTML = `
                <div class="custom-tour-card-header">
                    <div>
                        <h3>Custom Tour ${tour.id.substring(0, 8)}...</h3>
                        <p class="booking-date"><i class="fas fa-calendar"></i> ${tourDate}</p>
                    </div>
                    ${statusBadge}
                </div>
                <div class="booking-card-body">
                    <div class="itinerary-preview">
                        <h4><i class="fas fa-map-marker-alt"></i> Itinerary</h4>
                        <div>${locationTags || '<span class="location-tag">No locations</span>'}</div>
                        ${addonsList ? `<p style="margin-top: 10px; font-size: 0.9rem; color: #666;"><strong>Add-ons:</strong> ${addonsList}</p>` : ''}
                        <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
                            <i class="fas fa-users"></i> ${tour.travelers} traveler(s) • 
                            <i class="fas fa-clock"></i> ${tour.durationHours} hours
                        </p>
                    </div>
                    <div class="booking-price">
                        <div class="price-main">
                            <span class="price-krw">$${priceUSD}</span>
                            <span class="price-usd">USD</span>
                        </div>
                    </div>
                </div>
                <div class="booking-card-actions">
                    ${actionsHtml}
                </div>
            `;

            return card;
        }

        // Get custom tour status badge
        function getCustomTourStatusBadge(status) {
            const badges = {
                'pending': '<span class="status-badge status-pending">Pending</span>',
                'approved': '<span class="status-badge status-approved">Approved</span>',
                'rejected': '<span class="status-badge status-rejected">Rejected</span>',
                'paid': '<span class="status-badge status-paid">Paid</span>',
                'cancelled': '<span class="status-badge status-cancelled">Cancelled</span>'
            };
            return badges[status] || '<span class="status-badge">Unknown</span>';
        }

        // Get custom tour actions
        function getCustomTourActions(tour) {
            let actions = [];

            if (tour.status === 'pending') {
                actions.push(`
                    <button onclick="payNowCustomTour('${tour.id}')" class="btn-action btn-pay-now">
                        <i class="fas fa-credit-card"></i> Pay Now
                    </button>
                `);
                actions.push(`
                    <button onclick="cancelCustomTour('${tour.id}')" class="btn-action btn-cancel">
                        <i class="fas fa-times"></i> Cancel Request
                    </button>
                `);
            } else if (tour.status === 'approved') {
                actions.push(`
                    <button onclick="payNowCustomTour('${tour.id}')" class="btn-action btn-pay-now">
                        <i class="fas fa-credit-card"></i> Pay Now
                    </button>
                `);
                actions.push(`
                    <button onclick="messageAdmin('${tour.id}')" class="btn-action btn-message">
                        <i class="fas fa-envelope"></i> Message Admin
                    </button>
                `);
            } else if (tour.status === 'paid') {
                actions.push(`
                    <button onclick="viewCustomTourItinerary('${tour.id}')" class="btn-action btn-view">
                        <i class="fas fa-eye"></i> View Itinerary
                    </button>
                `);
            }
            // cancelled status shows no buttons (greyed out card)

            return actions.join('');
        }

        // Pay Now for custom tour
        async function payNowCustomTour(tourId) {
            try {
                // Fetch tour details to get payment intent
                const response = await fetch(`/api/custom/${tourId}/payment-intent`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success && result.clientSecret) {
                    // Redirect to Stripe payment or initialize Stripe Elements
                    // For now, redirect to payment page
                    window.location.href = `/payment?tourId=${tourId}&clientSecret=${result.clientSecret}`;
                } else {
                    throw new Error(result.message || 'Failed to create payment session');
                }
            } catch (error) {
                console.error('Error creating payment session:', error);
                alert('Failed to create payment session: ' + error.message);
            }
        }

        // Cancel custom tour
        async function cancelCustomTour(tourId) {
            if (!confirm('Are you sure you want to cancel this custom tour request? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/custom/${tourId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    // Reload custom tours
                    const user = window.currentUser;
                    if (user) {
                        await loadCustomTours(user.id);
                    }
                } else {
                    throw new Error(result.message || 'Failed to cancel tour');
                }
            } catch (error) {
                console.error('Error cancelling tour:', error);
                alert('Failed to cancel tour: ' + error.message);
            }
        }

        // Message admin
        function messageAdmin(tourId) {
            const email = 'chilltours.official@gmail.com';
            const subject = `Custom Tour ${tourId.substring(0, 8)} - Question`;
            window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}`;
        }

        // View itinerary
        function viewCustomTourItinerary(tourId) {
            // Open modal or redirect to itinerary page
            alert('Itinerary view coming soon! Tour ID: ' + tourId);
            // TODO: Implement itinerary modal or page
        }

        // Initialize dashboard - AUTH GUARD FIRST
        // CRITICAL: Prevent race conditions by ensuring DOM is ready
        (async () => {
            // Wait for DOM to be fully ready
            if (document.readyState === 'loading') {
                await new Promise(resolve => {
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', resolve);
                    } else {
                        resolve();
                    }
                });
            }
            
            // CRITICAL: Check auth BEFORE any API calls or DOM manipulation
            const user = await checkAuth();
            
            if (!user) {
                // Already redirected by checkAuth, but ensure we don't continue
                // Hide any content that might have loaded
                document.body.style.display = 'none';
                return;
            }
            
            // Verify we're not in logout state
            if (window._isLoggingOut) {
                return;
            }
            
            // Store user globally
            window.currentUser = user;
            currentUser = user;
            
            // Now safe to load data - but verify session still valid
            try {
                // Double-check session before making API calls
                const supabase = window.supabaseAuth?.getSupabase();
                if (supabase) {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (!session || !session.user || session.user.id !== user.id || window._isLoggingOut) {
                        window.location.replace('/login.html');
                        return;
                    }
                }
                
                // Load data in parallel
                await Promise.all([
                    loadBonusStatus(user.id),
                    loadBookings(user.id)
                ]);

                // Check for tab parameter in URL
                const urlParams = new URLSearchParams(window.location.search);
                const tab = urlParams.get('tab');
                if (tab === 'custom') {
                    switchTab('custom');
                }
            } catch (error) {
                console.error('Error initializing dashboard:', error);
                // If error is auth-related, redirect
                if (error.message && (error.message.includes('auth') || error.message.includes('session'))) {
                    window.location.replace('/login.html');
                }
            }
        })();
    </script>
</body>
